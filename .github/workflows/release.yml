name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
      - name: Test
        run: swift test && (cd forwarder && go test ./...)
      - name: Package
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="titan-$VERSION-macos-arm64"
          # A version-less copy so `releases/latest/download/titan-macos-arm64.tar.gz` always works.
          cp "dist/$NAME.tar.gz" dist/titan-macos-arm64.tar.gz
          (cd dist && shasum -a 256 titan-macos-arm64.tar.gz > titan-macos-arm64.tar.gz.sha256)
          # Release notes: this version's CHANGELOG section.
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Titan $VERSION" --notes-file notes.md \
            "dist/$NAME.tar.gz" "dist/$NAME.tar.gz.sha256" \
            dist/titan-macos-arm64.tar.gz dist/titan-macos-arm64.tar.gz.sha256
