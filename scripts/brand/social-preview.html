<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:640px}
body{background:#0B0F1A;font-family:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;color:#fff;position:relative;overflow:hidden}
.glow{position:absolute;width:900px;height:900px;left:-220px;top:-260px;background:radial-gradient(circle,rgba(124,58,237,.45),rgba(79,70,229,.12) 45%,transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px}
.wrap{position:absolute;inset:0;display:flex;align-items:center;gap:64px;padding:0 96px}
img{width:260px;height:260px;filter:drop-shadow(0 24px 48px rgba(76,29,149,.55))}
h1{font-size:112px;letter-spacing:-3px;margin:0 0 12px;font-weight:800}
p{font-size:34px;line-height:1.3;margin:0 0 30px;color:#C9C3F5;max-width:760px}
.chips{display:flex;gap:12px;flex-wrap:wrap}
.chip{font-size:22px;padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#E6E1FF}
.note{margin-top:22px;font-size:22px;color:#8B85B8}.url{position:absolute;right:96px;bottom:44px;font-size:22px;color:#8B85B8;font-family:ui-monospace,Menlo,monospace}
</style></head><body><div class="glow"></div><div class="grid"></div>
<div class="wrap"><img src="ICON_URL"><div>
<h1>Titan</h1>
<p>Reproducible per-project Linux dev environments on your Mac, in lightweight VMs.</p>
<div class="chips"><span class="chip">devcontainer.json</span><span class="chip">one VM per project</span><span class="chip">clone · cd · run</span></div><div class="note">Built on Apple's container runtime · Apple silicon · open source</div>
</div></div><div class="url">github.com/manoj1604/titan</div></body></html>
